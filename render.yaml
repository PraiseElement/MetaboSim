services:
  - type: web
    name: metabosim-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        sync: false # fill this in on Render dashboard with your Vercel URL
    healthCheckPath: /
    autoDeploy: true
